# "This can help" and its relatives: a sentence added to say the last one was
# useful.
#
# On held-out HC3 answers it fires on 1.3% of the human ones and 13% of the
# model's.
extends: existence
message: "'%s' says the last point helps. Say what it does."
level: warning
ignorecase: true
tokens:
  - 'this (?:can|will|may) help'
  - '(?:can|may|will) help to'
  - 'it may be helpful to'
  - 'they (?:can|will be able to) help'
  - 'will be able to (?:help|provide|advise|determine)'

tests:
  - name: fires
    input: |
      Warm the cache. This can help reduce load times.
    want: |
      1:17:Modelese.Helpers:'This can help' says the last point helps. Say what it does.
  - name: clean
    input: |
      Warm the cache. Load times drop to 200 ms.
    want: ""
