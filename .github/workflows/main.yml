name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Uploading the archive to a release needs a token that can write
    # contents; this repository's default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license travels inside it.
      - run: cp LICENSE Modelese/
      - run: zip -r Modelese.zip Modelese -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Modelese.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The oldest Vale the README says the style runs on.
      - name: Install Vale
        env:
          VALE_VERSION: 3.23.0
        run: |
          curl -sL --fail -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf vale.tar.gz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Every rule's own cases, with coverage: a rule no case makes fire
      # fails the run.
      - run: ./test.sh

      # The repository's own prose, under the vocabulary it ships.
      - run: vale README.md
